<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050608">
<title>Nakami Trading · Jaime Barbosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050608;
    --ink:#F3F6F7;
    --muted:rgba(243,246,247,.58);
    --line:rgba(243,246,247,.12);
    --card:#0D0F11;
    --cyan:#33E8DD;
    --kick:#53FC18;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Outfit',system-ui,sans-serif;
    background:var(--bg);color:var(--ink);
    min-height:100dvh;display:flex;justify-content:center;
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  .page{position:relative;width:100%;max-width:480px;min-height:100dvh;display:flex;flex-direction:column}

  /* ---- hero ---- */
  .hero{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;display:block}
  .hero::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(5,6,8,0) 45%, rgba(5,6,8,.75) 75%, var(--bg) 100%);
  }
  .hero-mark{
    position:absolute;left:0;right:0;bottom:22px;text-align:center;z-index:2;
  }
  .hero-mark h1{
    font-size:26px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
  }
  .hero-mark .tag{
    margin-top:6px;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
  }

  /* ---- links ---- */
  .links{padding:26px 22px 20px;display:flex;flex-direction:column;gap:14px}
  .link-card{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:18px 20px;border-radius:16px;background:var(--card);
    border:1px solid var(--line);text-decoration:none;color:var(--ink);
    transition:transform .15s, border-color .2s;
  }
  .link-card:active{transform:scale(.98)}
  .link-card .txt .row{display:flex;align-items:center;gap:8px}
  .link-card .title{font-size:17px;font-weight:700}
  .link-card .sub{margin-top:4px;font-size:12.5px;color:var(--muted)}
  .link-card .arrow{font-size:18px;color:var(--muted);flex-shrink:0}

  .link-card.mentoria{border-color:rgba(51,232,221,.25)}
  .link-card.mentoria .title{color:var(--ink)}
  .link-card.mentoria .arrow{color:var(--cyan)}

  .link-card.gratis .arrow{color:var(--cyan)}

  .link-card.kick{border-color:rgba(83,252,24,.28)}
  .live-pill{
    display:inline-flex;align-items:center;gap:5px;padding:3px 8px 3px 6px;border-radius:20px;
    background:rgba(83,252,24,.12);
  }
  .live-pill .dot{
    width:6px;height:6px;border-radius:50%;background:var(--kick);
    box-shadow:0 0 6px var(--kick);animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .live-pill span.txt{
    font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--kick);font-weight:600;
  }
  .link-card.kick .arrow{color:var(--kick)}

  footer{
    margin-top:auto;padding:24px 22px 40px;text-align:center;
  }
  .footer-tag{
    font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.16em;
    color:var(--muted);text-transform:uppercase;
  }

  @media (min-width:481px){
    body{align-items:flex-start}
    .page{box-shadow:0 0 60px rgba(0,0,0,.6)}
  }
</style>
</head>
<body>
<div class="page">

  <div class="hero">
    <img src="assets/jaime-portrait.png" alt="Jaime Barbosa - Nakami Trading">
    <div class="hero-mark">
      <h1>Nakami Trading</h1>
      <div class="tag">Trading · Disciplina · Fe</div>
    </div>
  </div>

  <div class="links">

    <a class="link-card mentoria" href="https://mentoria.nakamiacademy.com" target="_blank" rel="noopener">
      <div class="txt">
        <div class="title">Acompañamiento personalizado</div>
        <div class="sub">Mentoría 1 a 1 · Postulación requerida</div>
      </div>
      <span class="arrow">→</span>
    </a>

    <a class="link-card gratis" href="https://clasegratis.nakamiacademy.com" target="_blank" rel="noopener">
      <div class="txt">
        <div class="title">Clase gratis</div>
        <div class="sub">Cómo fondearse con $1,000,000 · En vivo</div>
      </div>
      <span class="arrow">→</span>
    </a>

    <a class="link-card kick" href="https://kick.com/jaimebarbosa" target="_blank" rel="noopener">
      <div class="txt">
        <div class="row">
          <div class="title">Kick</div>
          <span class="live-pill"><span class="dot"></span><span class="txt">En vivo</span></span>
        </div>
        <div class="sub">Trading en vivo · 2 veces por semana</div>
      </div>
      <span class="arrow">→</span>
    </a>

  </div>

  <footer>
    <div class="footer-tag">Nakami Academy</div>
  </footer>

</div>
</body>
</html>
